// ==== Счетчик подписчиков YouTube (NikasYT) ====
const YT_API_KEY = "AIzaSyALlk56iRH89nsqHk4EJCMf_fjVBWNG7nE";
const YT_CHANNEL_HANDLE = "NikasYt1";
const SUB_GOAL_STEPS = [4000, 5000, 10000, 20000];

// Округление чисел как на YouTube: 3 значащие цифры + суффикс тыс/млн/млрд
function formatYouTubeStyle(num){
  num = Math.floor(num);
  if(num < 1000) return String(num);
  const tiers = [
    {div: 1e9, suf: " млрд"},
    {div: 1e6, suf: " млн"},
    {div: 1e3, suf: " тыс"}
  ];
  for(const t of tiers){
    if(num >= t.div){
      const val = num / t.div;
      const intLen = Math.floor(val).toString().length;
      const decimals = Math.max(0, 3 - intLen);
      let str = val.toFixed(decimals);
      // убираем незначащие нули в конце (3.40 -> 3.4, 12.00 -> 12)
      if(decimals > 0) str = str.replace(/0+$/, "").replace(/\.$/, "");
      return str + t.suf;
    }
  }
  return String(num);
}

function getGoalBounds(subCount){
  let lower = 0;
  for(const g of SUB_GOAL_STEPS){
    if(subCount < g) return {lower, upper: g};
    lower = g;
  }
  return {lower: SUB_GOAL_STEPS[SUB_GOAL_STEPS.length - 1], upper: null};
}

function updateSubGoalText(subCount){
  const textEl = document.getElementById("sub-goal-text");
  const fillEl = document.getElementById("sub-goal-p-fill");
  const labelEl = document.getElementById("sub-goal-p-label");
  if(!textEl) return;
  const {lower, upper} = getGoalBounds(subCount);
  if(upper){
    textEl.innerText = `Помоги набрать ${upper.toLocaleString("ru-RU")} подписчиков!`;
    const pct = Math.max(0, Math.min(100, Math.round((subCount - lower) / (upper - lower) * 100)));
    if(fillEl) fillEl.style.width = pct + "%";
    if(labelEl) labelEl.innerText = `${formatYouTubeStyle(subCount)} / ${formatYouTubeStyle(upper)}`;
  } else {
    textEl.innerText = `Спасибо за 20 000 подписчиков!`;
    if(fillEl) fillEl.style.width = "100%";
    if(labelEl) labelEl.innerText = `${formatYouTubeStyle(subCount)} подписчиков`;
  }
}

async function fetchSubscriberCount(){
  if(!YT_API_KEY || YT_API_KEY.indexOf("ВСТАВЬТЕ") === 0){
    console.warn("YT_API_KEY не задан — счетчик подписчиков работает в статичном режиме.");
    return;
  }
  try{
    const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&forHandle=${YT_CHANNEL_HANDLE}&key=${YT_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    const count = parseInt(data.items[0].statistics.subscriberCount, 10);
    if(!isNaN(count)) updateSubGoalText(count);
  }catch(e){
    console.error("Ошибка получения числа подписчиков:", e);
  }
}

fetchSubscriberCount();
setInterval(fetchSubscriberCount, 5 * 60 * 1000); // проверка раз в 5 минут
